name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Ruff
        run: poetry run ruff check .

      - name: Pytest
        run: poetry run pytest